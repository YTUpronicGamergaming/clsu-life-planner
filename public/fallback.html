<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#385344" />
    <title>Read-only schedule | CLSU Life Planner</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
        color: #23332a;
        background: #f6f5f0;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        max-width: 1050px;
        margin: 0 auto;
        padding: 28px 18px 56px;
      }

      header,
      section {
        border: 1px solid #dfe5dc;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 8px 24px #263b2b0b;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
        padding: 20px;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 5px;
        color: #385344;
        font-size: clamp(1.35rem, 3vw, 2rem);
      }

      h2 {
        margin-bottom: 14px;
        font-size: 1.1rem;
      }

      .muted,
      #status {
        color: #627067;
        font-size: 0.92rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      button,
      .link-button {
        min-height: 42px;
        border: 1px solid #385344;
        border-radius: 10px;
        padding: 9px 14px;
        color: #fff;
        background: #385344;
        font: inherit;
        font-weight: 650;
        text-decoration: none;
        cursor: pointer;
      }

      button.secondary,
      .link-button.secondary {
        color: #385344;
        background: #fff;
      }

      section {
        margin-bottom: 18px;
        padding: 20px;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      th,
      td {
        border-bottom: 1px solid #e8ece6;
        padding: 11px 9px;
        vertical-align: top;
      }

      th {
        color: #526357;
        font-size: 0.82rem;
      }

      td {
        font-size: 0.94rem;
      }

      .empty {
        color: #627067;
        padding: 8px 0 0;
      }

      .task-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .task {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        border-bottom: 1px solid #e8ece6;
        padding: 10px 0;
      }

      .task:last-child {
        border-bottom: 0;
      }

      .task-title {
        font-weight: 650;
        overflow-wrap: anywhere;
      }

      .task-meta {
        flex: 0 0 auto;
        color: #627067;
        text-align: right;
        font-size: 0.9rem;
      }

      @media (max-width: 560px) {
        body {
          padding: 16px 12px 36px;
        }

        header,
        section {
          padding: 16px;
        }

        th,
        td {
          padding: 9px 7px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1 id="scheduleTitle">CLSU Life Planner</h1>
        <p class="muted" id="semester">Read-only schedule view</p>
        <p id="status" role="status" aria-live="polite">Loading schedule…</p>
      </div>
      <div class="actions">
        <button id="refresh" type="button">Refresh</button>
          <a class="link-button secondary" href="/">Switch to main planner</a>
      </div>
    </header>

    <main>
      <section aria-labelledby="classesHeading">
        <h2 id="classesHeading">Class schedule</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Day</th>
                <th scope="col">Time</th>
                <th scope="col">Subject</th>
                <th scope="col">Room</th>
              </tr>
            </thead>
            <tbody id="classes"></tbody>
          </table>
        </div>
        <p class="empty" id="noClasses" hidden>No class meetings saved.</p>
      </section>

      <section aria-labelledby="tasksHeading">
        <h2 id="tasksHeading">Personal plans</h2>
        <ul class="task-list" id="tasks"></ul>
        <p class="empty" id="noTasks" hidden>No personal plans saved.</p>
      </section>
    </main>

    <script type="module" src="/fallback.js"></script>
  </body>
</html>
